<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthOS | Notificações</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="bg-slate-50 min-h-screen">
    <nav id="app-nav" class="bg-white border-b border-slate-200 px-6 py-4 sticky top-0 z-50 h-[73px]"></nav>

    <header class="max-w-4xl mx-auto px-4 sm:px-6 py-10 flex flex-wrap items-end justify-between gap-4">
        <div>
            <h1 class="text-3xl font-extrabold text-slate-900 mb-2">Notificações</h1>
            <p class="text-slate-600">Caixa de entrada de <strong id="profile-name"></strong> (troque o perfil no topo da página).</p>
        </div>
        <button id="mark-all" class="bg-white border border-slate-200 px-4 py-2 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-100">
            <i class="fas fa-check-double"></i> Marcar todas como lidas</button>
    </header>

    <main class="max-w-4xl mx-auto px-4 sm:px-6 pb-20">
        <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
            <div class="bg-white p-1 rounded-xl border border-slate-200 flex gap-1" role="tablist" id="tabs"></div>
            <label class="text-sm text-slate-600">Categoria <select id="category" class="p-2 border rounded-lg ml-1"></select></label>
        </div>
        <section id="list" class="space-y-3" aria-live="polite"></section>
        <div id="pagination"></div>
    </main>

    <script type="module" src="/static/js/pages/notifications.js"></script>
</body>
</html>
