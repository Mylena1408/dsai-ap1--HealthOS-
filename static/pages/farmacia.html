<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthOS | Farmácia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="bg-slate-50 min-h-screen">
    <nav id="app-nav" class="bg-white border-b border-slate-200 px-6 py-4 sticky top-0 z-50 h-[73px]"></nav>

    <header class="max-w-6xl mx-auto px-4 sm:px-6 py-10">
        <h1 class="text-3xl font-extrabold text-slate-900 mb-2">Farmácia</h1>
        <p class="text-slate-600">Prescrição → dispensação → baixa no estoque por lote (FEFO: vence primeiro, sai primeiro).</p>
    </header>

    <main class="max-w-6xl mx-auto px-4 sm:px-6 pb-20">
        <div class="flex justify-center mb-6">
            <div class="bg-white p-1 rounded-xl border border-slate-200 flex flex-wrap gap-1" role="tablist">
                <button data-tab="queue" role="tab" class="tab px-4 py-2 rounded-lg text-sm font-bold">Fila de dispensação</button>
                <button data-tab="stock" role="tab" class="tab px-4 py-2 rounded-lg text-sm font-bold">Estoque</button>
                <button data-tab="expiry" role="tab" class="tab px-4 py-2 rounded-lg text-sm font-bold">Validade</button>
                <button data-tab="movements" role="tab" class="tab px-4 py-2 rounded-lg text-sm font-bold">Movimentações</button>
            </div>
        </div>
        <section id="content" class="space-y-4" aria-live="polite"></section>
        <div id="pagination"></div>
    </main>

    <div id="modal-dispense" class="modal" role="dialog" aria-modal="true" aria-labelledby="dispense-title">
        <div class="bg-white p-6 sm:p-8 rounded-2xl w-full max-w-lg shadow-2xl relative">
            <button data-close-modal="modal-dispense" aria-label="Fechar" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600"><i class="fas fa-times"></i></button>
            <h3 id="dispense-title" class="text-xl font-bold text-slate-800 mb-4">Dispensar prescrição</h3>
            <form id="form-dispense" class="space-y-3">
                <div class="grid grid-cols-2 gap-3">
                    <label class="text-sm text-slate-600">Farmacêutico(a)<select id="d-pharmacist" required class="w-full p-2 border rounded-lg mt-1"></select></label>
                    <label class="text-sm text-slate-600">Local<input id="d-location" required value="FARMACIA_CENTRAL" class="w-full p-2 border rounded-lg mt-1"></label>
                </div>
                <div id="d-items" class="space-y-2"></div>
                <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700">Dispensar</button>
            </form>
            <div id="d-result" class="mt-4 text-sm hidden" role="status"></div>
        </div>
    </div>

    <script type="module" src="/static/js/pages/pharmacy.js"></script>
</body>
</html>
