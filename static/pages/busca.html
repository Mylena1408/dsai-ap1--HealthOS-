<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthOS | Busca</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="bg-slate-50 min-h-screen">
    <nav id="app-nav" class="bg-white border-b border-slate-200 px-6 py-4 sticky top-0 z-50 h-[73px]"></nav>

    <header class="max-w-4xl mx-auto px-4 sm:px-6 py-10">
        <h1 class="text-3xl font-extrabold text-slate-900 mb-4">Busca</h1>
        <form id="form-search" role="search" class="flex gap-2">
            <label for="q" class="sr-only">Termo de busca</label>
            <input id="q" name="q" type="search" required minlength="2" maxlength="80" autocomplete="off"
                placeholder="Nome, CPF, registro profissional, código de amostra, nº da fatura..."
                class="flex-1 p-3 border rounded-xl">
            <button type="submit" class="bg-blue-600 text-white px-5 rounded-xl font-bold hover:bg-blue-700">
                <i class="fas fa-magnifying-glass" aria-hidden="true"></i><span class="sr-only">Buscar</span></button>
        </form>
        <p class="text-xs text-slate-500 mt-2">O CPF aparece mascarado nos resultados. Dica: tecle "/" em qualquer página para buscar.</p>
    </header>

    <main class="max-w-4xl mx-auto px-4 sm:px-6 pb-20">
        <section id="results" class="space-y-4" aria-live="polite"></section>
    </main>

    <script type="module" src="/static/js/pages/search.js"></script>
</body>
</html>
