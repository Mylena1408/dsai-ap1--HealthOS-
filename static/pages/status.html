<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthOS | Status do Sistema</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="bg-slate-50 min-h-screen">
    <nav id="app-nav" class="bg-white border-b border-slate-200 px-6 py-4 sticky top-0 z-50 h-[73px]"></nav>

    <header class="max-w-5xl mx-auto px-4 sm:px-6 py-10">
        <div class="flex flex-wrap items-end justify-between gap-4">
            <div>
                <h1 class="text-3xl font-extrabold text-slate-900 mb-2">Status do Sistema</h1>
                <p class="text-slate-600">Saúde da aplicação, banco de dados e métricas de requisições desde o último reinício.</p>
            </div>
            <button id="btn-refresh" class="bg-white border border-slate-200 px-4 py-2 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-100">
                <i class="fas fa-rotate"></i> Atualizar
            </button>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 sm:px-6 pb-20 space-y-6">
        <section id="status-tiles" class="grid grid-cols-2 lg:grid-cols-4 gap-4" aria-live="polite"></section>

        <section class="glass-card rounded-2xl p-6">
            <h2 class="text-lg font-bold text-slate-800 mb-4">Registros no banco</h2>
            <div id="db-records" class="grid grid-cols-2 sm:grid-cols-5 gap-3"></div>
        </section>

        <section class="glass-card rounded-2xl p-6">
            <h2 class="text-lg font-bold text-slate-800 mb-4">Requisições por rota</h2>
            <div class="relative overflow-x-auto" tabindex="0" role="region" aria-label="Requisições por rota (tabela)">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="text-left text-slate-500 border-b">
                            <th class="py-2 pr-4 font-medium">Rota</th>
                            <th class="py-2 pr-4 font-medium text-right">Chamadas</th>
                            <th class="py-2 pr-4 font-medium text-right">Erros 5xx</th>
                            <th class="py-2 pr-4 font-medium text-right">Média (ms)</th>
                            <th class="py-2 font-medium text-right">Máx. (ms)</th>
                        </tr>
                    </thead>
                    <tbody id="routes-body"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script type="module" src="/static/js/pages/status.js"></script>
</body>
</html>
