<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthOS | Alertas</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="bg-slate-50 min-h-screen">
    <nav id="app-nav" class="bg-white border-b border-slate-200 px-6 py-4 sticky top-0 z-50 h-[73px]"></nav>

    <header class="max-w-6xl mx-auto px-4 sm:px-6 py-10 flex flex-wrap items-end justify-between gap-4">
        <div>
            <h1 class="text-3xl font-extrabold text-slate-900 mb-2">Alertas</h1>
            <p class="text-slate-600">Gerados por regras sobre os dados do sistema; resolvem-se sozinhos quando a condição normaliza.</p>
        </div>
        <button id="evaluate" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-blue-700">
            <i class="fas fa-rotate"></i> Avaliar regras agora</button>
    </header>

    <main class="max-w-6xl mx-auto px-4 sm:px-6 pb-20 space-y-6">
        <section id="tiles" class="grid grid-cols-1 sm:grid-cols-3 gap-4" aria-live="polite"></section>
        <form id="filters" class="glass-card rounded-2xl p-4 grid grid-cols-1 sm:grid-cols-3 gap-3">
            <label class="text-sm text-slate-600">Situação <select id="f-status" class="w-full p-2 border rounded-lg mt-1"></select></label>
            <label class="text-sm text-slate-600">Categoria <select id="f-category" class="w-full p-2 border rounded-lg mt-1"></select></label>
            <label class="text-sm text-slate-600">Nível <select id="f-level" class="w-full p-2 border rounded-lg mt-1"></select></label>
        </form>
        <section id="list" class="space-y-3" aria-live="polite"></section>
        <div id="pagination"></div>
        <details class="glass-card rounded-2xl p-5">
            <summary class="font-bold text-slate-800 cursor-pointer">Regras avaliadas</summary>
            <ul id="rules" class="mt-3 space-y-2 text-sm"></ul>
        </details>
    </main>

    <div id="modal-resolve" class="modal" role="dialog" aria-modal="true" aria-labelledby="resolve-title">
        <div class="bg-white p-6 sm:p-8 rounded-2xl w-full max-w-md shadow-2xl relative">
            <button data-close-modal="modal-resolve" aria-label="Fechar" class="absolute top-4 right-4 text-slate-500 hover:text-slate-600"><i class="fas fa-times"></i></button>
            <h3 id="resolve-title" class="text-xl font-bold text-slate-800 mb-4">Resolver alerta</h3>
            <form id="form-resolve" class="space-y-4">
                <textarea id="resolve-note" required minlength="5" maxlength="500" placeholder="O que foi feito?" class="w-full p-2 border rounded-lg h-28"></textarea>
                <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700">Resolver</button>
            </form>
        </div>
    </div>

    <script type="module" src="/static/js/pages/alerts.js"></script>
</body>
</html>
