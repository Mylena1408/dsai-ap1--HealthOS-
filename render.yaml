# Configuração do serviço no Render (Blueprint).
# Só é aplicada se o serviço for criado/sincronizado como Blueprint no painel do Render;
# para um serviço já criado pelo painel, use estes mesmos valores em Settings > Build & Deploy
# e em Environment. A versão do Python vem de .python-version (3.12) — não defina
# PYTHON_VERSION no painel, pois ela teria prioridade sobre o arquivo.
services:
  - type: web
    name: dsai-ap1-healthos
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # O Render informa a porta em $PORT; 0.0.0.0 aceita conexões vindas do proxy do Render.
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # SQLite dentro do serviço. No plano gratuito o disco não é persistente: o banco volta ao
      # app.db do repositório a cada deploy/reinício. Para dados persistentes, use um PostgreSQL
      # do Render e cole aqui a URL (postgres:// é convertida para o driver asyncpg).
      - key: DATABASE_URL
        value: sqlite:///./app.db
      - key: SECRET_KEY
        generateValue: true
      # Recria os dados fictícios de demonstração na inicialização (idempotente).
      - key: SEED_DEMO_DATA
        value: "True"
      # Horários do sistema no fuso de Belém (o servidor Linux roda em UTC).
      - key: APP_TIMEZONE
        value: America/Belem
      - key: ALERT_EVALUATION_INTERVAL_MINUTES
        value: "15"
      # "demo" funciona sem rede e sem chave. Para "anthropic", inclua requirements-ai.txt no build
      # e cadastre ANTHROPIC_API_KEY como segredo no painel (nunca no repositório).
      - key: AI_PROVIDER
        value: demo
