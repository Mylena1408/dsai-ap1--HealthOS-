# Configuração do serviço no Render (Blueprint).
# Só é aplicada se o serviço for criado/sincronizado como Blueprint no painel do Render;
# para um serviço já criado pelo painel, use estes mesmos valores em Settings > Build & Deploy
# e em Environment. A versão do Python vem de .python-version (3.13); se PYTHON_VERSION existir
# no painel (hoje: 3.13.4), ela tem prioridade — mantenha-a em 3.13.x (3.14 não tem pacotes
# para as versões fixadas).
services:
  - type: web
    name: dsai-ap1-healthos
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # O Render informa a porta em $PORT; 0.0.0.0 aceita conexões vindas do proxy do Render.
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Produção usa PostgreSQL: a URL fica só no painel (sync: false = o Blueprint não a altera).
      # postgres:// e postgresql:// são convertidas para o driver asyncpg.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      # True cria os dados fictícios de demonstração na inicialização (idempotente: não duplica).
      - key: SEED_DEMO_DATA
        value: "False"
      # Horários do sistema no fuso de Belém (o servidor Linux roda em UTC).
      - key: APP_TIMEZONE
        value: America/Belem
      - key: ALERT_EVALUATION_INTERVAL_MINUTES
        value: "15"
      # "demo" funciona sem rede e sem chave. Para "anthropic", inclua requirements-ai.txt no build
      # e cadastre ANTHROPIC_API_KEY como segredo no painel (nunca no repositório).
      - key: AI_PROVIDER
        value: demo
